<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hidden Object Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23007bff'/%3E%3Ccircle cx='26' cy='28' r='10' fill='white'/%3E%3Cpath d='M38 38l10 10' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --line: #dfe6f1;
            --text: #1c2533;
            --muted: #5f6b7a;
            --primary: #0f8f78;
            --primary-dark: #0c725f;
            --danger: #cc3d4d;
            --danger-dark: #a82e3d;
            --radius: 12px;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 20% 0%, #e7f4ff 0%, var(--bg) 35%, #eef2f7 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: min(1360px, 100vw);
            height: 100vh;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 10px;
        }
        h1 {
            margin: 0;
            padding: 10px 14px;
            font-size: 24px;
            line-height: 1.2;
            letter-spacing: 0.01em;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .setup-section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 220px minmax(260px, 1fr) minmax(280px, 1fr) auto;
            gap: 10px;
            align-items: start;
        }
        .setup-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .setup-block-title {
            margin: 0;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .setup-block p {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
        }
        input[type="file"],
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
        }
        input[type="file"] {
            padding: 8px;
            font-size: 13px;
        }
        textarea {
            padding: 9px;
            resize: none;
            min-height: 84px;
            font-size: 13px;
        }
        .model-selector-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            margin: 0;
        }
        .selector-field {
            display: grid;
            grid-template-columns: 92px 1fr;
            align-items: center;
            gap: 6px;
        }
        .selector-field label {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }
        .selector-field select {
            padding: 7px;
            font-size: 12px;
            min-width: 0;
        }
        .action-block {
            display: flex;
            flex-direction: column;
            justify-content: end;
            height: 100%;
        }
        button {
            border: none;
            border-radius: 8px;
            color: #fff;
            background-color: #2f7de6;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover:not(:disabled) {
            background-color: #2168c6;
        }
        button:disabled {
            background-color: #a7b5cb;
            cursor: not-allowed;
        }
        .game-section {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 10px;
        }
        .image-display-area,
        .game-info-area {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            min-height: 0;
        }
        .image-display-area {
            padding: 10px;
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 8px;
        }
        .image-container {
            position: relative;
            width: 100%;
            min-height: 0;
            height: 100%;
            display: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: repeating-linear-gradient(
                45deg,
                #f3f6fb,
                #f3f6fb 12px,
                #edf2f9 12px,
                #edf2f9 24px
            );
            overflow: hidden;
            cursor: crosshair;
        }
        #imagePreview, #boundingBoxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #imagePreview {
            z-index: 1;
        }
        #boundingBoxCanvas {
            z-index: 2;
        }
        #startGameButton {
            width: 100%;
            background-color: var(--primary);
        }
        #startGameButton:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }
        .game-info-area {
            padding: 10px;
            display: grid;
            grid-template-rows: auto minmax(140px, 1fr) auto auto;
            gap: 8px;
        }
        #newImageButton {
            width: 100%;
            margin: 0;
            background-color: #4f5f78;
        }
        #newImageButton:hover:not(:disabled) {
            background-color: #3f4e64;
        }
        #objectListContainer {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            overflow: auto;
            min-height: 0;
        }
        #objectListContainer h3 {
            margin: 0 0 6px;
            font-size: 14px;
        }
        #objectList {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #objectList li {
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            color: #2f3a48;
        }
        #objectList li:nth-child(even) {
            background: #f7f9fc;
        }
        #objectList li.found {
            color: #6b7684;
            text-decoration: line-through;
            background: #e7f5ee;
        }
        #gameStatus {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            color: #3b4756;
            min-height: 58px;
            overflow: auto;
        }
        #gameStatus p {
            margin: 0;
        }
        #giveUpButton {
            width: 100%;
            margin: 0;
            background-color: var(--danger);
        }
        #giveUpButton:hover:not(:disabled) {
            background-color: var(--danger-dark);
        }
        .win-message {
            color: #1f9e65;
            font-weight: 700;
        }
        h2,
        hr {
            display: none;
        }
        body.game-active {
            overflow: hidden;
        }
        @media (max-width: 1180px) {
            body {
                overflow: auto;
            }
            .container {
                height: auto;
                min-height: 100vh;
            }
            .setup-section {
                grid-template-columns: 1fr 1fr;
            }
            .action-block {
                grid-column: 1 / -1;
            }
            .game-section {
                grid-template-columns: 1fr;
                grid-template-rows: 58vh auto;
            }
            .game-info-area {
                grid-template-rows: auto minmax(120px, 220px) auto auto;
            }
        }
        @media (max-width: 760px) {
            .container {
                padding: 8px;
                gap: 8px;
            }
            h1 {
                font-size: 20px;
            }
            .setup-section {
                grid-template-columns: 1fr;
            }
            .selector-field {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .game-section {
                grid-template-rows: 52vh auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Hidden Object Game</h1>

        <div class="setup-section">
            <div class="setup-block">
                <p class="setup-block-title">Source Image</p>
                <p>Upload your own image file.</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="setup-block">
                <p class="setup-block-title">AI Prompt</p>
                <p>Generate a scene when you do not upload a file.</p>
                <textarea id="genPromptInput" placeholder="A cluttered attic with many old objects"></textarea>
            </div>

            <div class="setup-block">
                <p class="setup-block-title">Model Setup</p>
                <div class="model-selector-row">
                    <div class="selector-field">
                        <label for="imageModelSelect">Image model</label>
                        <select id="imageModelSelect"></select>
                    </div>
                    <div class="selector-field">
                        <label for="analysisModelSelect">Analysis model</label>
                        <select id="analysisModelSelect"></select>
                    </div>
                </div>
            </div>

            <div class="setup-block action-block">
                <button id="generateImageButton">Generate Image</button>
            </div>
        </div>
        
        <div class="game-section">
            <div class="image-display-area">
                <div class="image-container" id="imageContainer">
                    <img id="imagePreview" src="" alt="Image Preview">
                    <canvas id="boundingBoxCanvas"></canvas>
                </div>
                <button id="startGameButton" disabled>Start New Game</button>
            </div>

            <div class="game-info-area">
                      <button id="newImageButton" style="display: none;">← New Image</button>
                 <div id="objectListContainer">
                    <h3>Objects to Find:</h3>
                    <ul id="objectList"></ul>
                 </div>
                 <div id="gameStatus">
                    <p>First, upload or generate an image, then click "Start New Game" to begin!</p>
                 </div>
                 <button id="giveUpButton" style="display: none;">Give Up</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
