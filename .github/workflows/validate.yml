name: Validate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax checks
        run: |
          node --check api.js
          node --check canvas.js
          node --check game.js
          node --check main.js
          node --check ui.js
          node --check utils.js
          node --check test-analysis.mjs